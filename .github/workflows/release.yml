name: Release

# Triggered by pushing a version tag (e.g. v3.2.0). Runs the full test
# gate, publishes to npm via Trusted Publishing (OIDC, no NPM_TOKEN),
# then creates a GitHub Release with the published tarball and a signed
# SLSA build-provenance attestation attached as assets.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    # Least privilege: the write scopes live on this job only, never at the
    # workflow top level, so no other (future) job inherits them.
    permissions:
      contents: write # create the GitHub Release and upload assets
      id-token: write # OIDC: npm Trusted Publishing + Sigstore signing for attestation
      attestations: write # persist the build-provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          # npm Trusted Publishing requires Node 22.14.0+ (npm CLI 11.5.1+).
          # The rest of this repo's CI uses Node 20 for testing; this
          # workflow deliberately uses a newer Node solely because
          # publishing needs it.
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify tag matches package.json version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version=$(node -p "require('./package.json').version")
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag v$tag_version does not match package.json version $pkg_version"
            exit 1
          fi

      - name: Ensure npm CLI supports Trusted Publishing
        # Pinned to an exact version, not npm@latest: a real release run
        # confirmed that whatever "latest" currently resolves to on
        # GitHub's runner image has a corrupted install, missing its own
        # sigstore dependency, which breaks provenance generation with
        # "Cannot find module 'sigstore'" during npm publish. The
        # runner's own bundled npm (10.9.8) is intact but predates OIDC
        # Trusted Publishing support (needs 11.5.1+); pinning the exact
        # minimum version avoids both problems, confirmed on a live
        # runner before this change.
        run: npm install -g npm@11.5.1

      - name: Install dependencies
        env:
          NODE_ENV: development
        run: npm ci --include=dev

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Audit
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build

      - name: Pack tarball
        id: pack
        run: |
          tarball=$(npm pack | tail -n1)
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Probe the packed tarball's public exports
        # Installs the exact tarball into a scratch directory and imports it through
        # the package's exports map, the way a consumer does. Guards the failure class
        # where a symbol exists in dist but is unreachable from the package root
        # (ERR_PACKAGE_PATH_NOT_EXPORTED), which no source-level test can see.
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          set -euo pipefail
          probe=$(mktemp -d)
          cp "./$TARBALL" "$probe/"
          cd "$probe"
          npm init -y >/dev/null
          npm install --silent --ignore-scripts "./$TARBALL"
          node --input-type=module -e "
            const m = await import('agent-passport-system');
            const c = await import('agent-passport-system/core');
            for (const name of ['verifyAuthorityDelegationChain','verifyAuthorityDelegationSignature','parseAuthorityDelegationJson','verifyReceiptV1','computeReceiptIdV1']) {
              if (typeof m[name] !== 'function') { console.error('root export missing: ' + name); process.exit(1); }
            }
            if (typeof c.verifyPassport !== 'function') { console.error('core export missing: verifyPassport'); process.exit(1); }
            console.log('packed tarball exports probe: ok');
          "

      - name: Check whether this version is already on the registry
        # An already-published version must not abort the run: if the packed
        # tarball is byte-identical to the registry's (sha1, the registry
        # shasum), publishing is skipped and the downstream steps (SBOM,
        # GitHub Release, repository build-provenance attestation) still run
        # against the same artifact. Different bytes under the same version is
        # a real conflict and fails hard.
        #
        # NOTE ON WHAT A SKIP COSTS, so nobody reads this guard as a repair:
        # npm provenance is generated by `npm publish` under Trusted
        # Publishing and is what `npm audit signatures` checks. Skipping the
        # publish means the registry has NO npm provenance for that version,
        # and nothing downstream restores it. The attest-build-provenance step
        # below produces a GitHub repository attestation over the tarball,
        # which is separate evidence and not a substitute. A version published
        # without npm provenance can only gain it by publishing a new version.
        id: published
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          if live=$(npm view "agent-passport-system@$v" dist.shasum 2>/tmp/npmview.err); then
            packed=$(sha1sum "./$TARBALL" | awk '{print $1}')
            if [ "$live" = "$packed" ]; then
              echo "already published and byte-identical (shasum $live); publish will be skipped"
              echo "npm provenance for $v is whatever the original publish produced; this run cannot add it"
              echo "state=identical" >> "$GITHUB_OUTPUT"
            else
              echo "::error::version $v already published with different bytes (registry $live, packed $packed)"
              exit 1
            fi
          elif grep -q "E404" /tmp/npmview.err; then
            echo "state=absent" >> "$GITHUB_OUTPUT"
          else
            # A lookup failure is not evidence of absence. Publishing here is
            # how the v5.0.0 abort happened in the first place.
            echo "::error::could not determine whether $v is published; npm view failed for a reason other than E404"
            cat /tmp/npmview.err
            exit 1
          fi

      - name: Publish to npm (Trusted Publishing, OIDC)
        # Publishes the tarball packed above, the same file the attestation
        # step signs, so the provenance subject and the shipped bytes are one
        # artifact. A bare `npm publish` would pack a second time. The
        # relative path begins with ./ so npm reads it as a file, not a spec.
        if: steps.published.outputs.state == 'absent'
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: npm publish "./$TARBALL"

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: ${{ steps.pack.outputs.tarball }}

      - name: Rename attestation to match Scorecard's expected suffix
        id: attestation-asset
        run: |
          renamed="agent-passport-system-${GITHUB_REF_NAME#v}.intoto.jsonl"
          cp "${{ steps.attest.outputs.bundle-path }}" "$renamed"
          echo "path=$renamed" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM
        id: sbom
        run: |
          out="agent-passport-system-${GITHUB_REF_NAME#v}.sbom.spdx.json"
          npm sbom --sbom-format spdx --omit dev > "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        # If the release already exists (a rerun after a manual release), the
        # existing notes are kept and only the artifacts are attached; assets
        # are clobbered so a rerun converges instead of failing.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --clobber \
              "${{ steps.pack.outputs.tarball }}" \
              "${{ steps.attestation-asset.outputs.path }}" \
              "${{ steps.sbom.outputs.path }}"
          else
            gh release create "$GITHUB_REF_NAME" \
              "${{ steps.pack.outputs.tarball }}" \
              "${{ steps.attestation-asset.outputs.path }}" \
              "${{ steps.sbom.outputs.path }}" \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
