name: ClusterFuzzLite PR fuzzing

on:
  pull_request:
    paths:
      - 'src/**'
      - 'fuzz/**'
      - '.clusterfuzzlite/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/cflite_pr.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  PR:
    runs-on: ubuntu-latest
    steps:
      - name: Build Fuzzers
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: javascript
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # The build_fuzzers/run_fuzzers actions only accept address,
          # undefined, memory, or coverage here, none is not a valid
          # value even though project.yaml's own sanitizers: [none] is
          # the documented default for JS projects generally (a separate
          # field). address seemed like the obvious choice (it's what
          # google/oss-fuzz's own cflite_pr.yml uses for their Python
          # project, another memory-safe language), but a real CI run
          # confirmed that's wrong specifically for JavaScript: the base
          # image hard-rejects it with "JavaScript projects cannot be
          # fuzzed with sanitizers." coverage is the only one of the 4
          # that isn't a real sanitizer, matching what the official JS
          # integration guide actually says.
          sanitizer: coverage
      - name: Run Fuzzers
        id: run
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # 7 targets, roughly 90 seconds each: a PR-scale time box, not
          # the exhaustive run (see cflite_batch.yml for that).
          fuzz-seconds: 600
          mode: 'code-change'
          sanitizer: coverage
          output-sarif: true
