name: ClusterFuzzLite PR fuzzing

on:
  pull_request:
    paths:
      - 'src/**'
      - 'fuzz/**'
      - '.clusterfuzzlite/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/cflite_pr.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  PR:
    runs-on: ubuntu-latest
    steps:
      - name: Build Fuzzers
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: javascript
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # The build_fuzzers/run_fuzzers actions only accept address,
          # undefined, memory, or coverage here, none is not a valid
          # value even though project.yaml's own sanitizers: [none] is
          # the documented default for JS projects generally (a separate
          # field). Confirmed live: google/oss-fuzz's own cflite_pr.yml
          # for their Python project (also memory-safe, no real ASan)
          # uses address in this exact PR-fuzzing context, so this
          # matches the real, working precedent rather than coverage,
          # which the docs reserve for a dedicated report-generation job.
          sanitizer: address
      - name: Run Fuzzers
        id: run
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # 7 targets, roughly 90 seconds each: a PR-scale time box, not
          # the exhaustive run (see cflite_batch.yml for that).
          fuzz-seconds: 600
          mode: 'code-change'
          sanitizer: address
          output-sarif: true
